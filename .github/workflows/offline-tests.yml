name: Offline synthetic tests
on: [push, pull_request]

jobs:
  cpu:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install matching CPU Torch wheels
        run: python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install test and optional JAX dependencies
        run: python -m pip install '.[experiments,test,jax]' jax==0.6.2 optax==0.2.5 chex==0.1.90
      - name: Run non-JAX data-free regression suite
        run: python -m pytest -q --ignore=tests/test_jax_optimizer.py
      - name: Run real JAX regression suite in a separate process
        run: python -m pytest -q tests/test_jax_optimizer.py
      - name: Compile and run original tokenizer fixtures
        run: |
          gcc -O2 -o "$RUNNER_TEMP/metaopt-tokenizer-test" codes/MetaOptimize/tinystories/test.c -lm
          (cd codes/MetaOptimize/tinystories && "$RUNNER_TEMP/metaopt-tokenizer-test")
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build
